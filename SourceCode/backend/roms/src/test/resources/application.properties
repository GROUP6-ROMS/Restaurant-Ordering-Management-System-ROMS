spring.application.name=roms-test

# ===================================================================
# Test Database Configuration (H2 in-memory MSSQL Server compatibility mode)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:roms_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

