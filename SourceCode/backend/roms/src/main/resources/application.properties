spring.application.name=roms
server.port=8080

# ===================================================================
# Database Configuration (Microsoft SQL Server 2022)
# ===================================================================
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:roms_db};encrypt=true;trustServerCertificate=true;createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:Password123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===================================================================
# Security & JWT Configuration (NFR-S01: Staff 8h, Customer 4h)
# ===================================================================
roms.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 8 hours = 8 * 60 * 60 * 1000 = 28,800,000 ms
roms.jwt.expiration-ms=28800000
# 4 hours = 4 * 60 * 60 * 1000 = 14,400,000 ms
roms.jwt.customer-expiration-ms=14400000

# ===================================================================
# OpenAPI / Swagger UI (NFR-M02)
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
