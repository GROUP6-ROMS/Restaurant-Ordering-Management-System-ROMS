# ==========================================================
# ROMS - Restaurant Ordering Management System
# File cấu hình backend (application.properties)
# ==========================================================

# Tên ứng dụng (hiện trong log)
spring.application.name=roms

# ==========================================================
# DATABASE - Microsoft SQL Server
# ==========================================================
# Cú pháp: jdbc:sqlserver://HOST:PORT;databaseName=TÊN_DB
# encrypt=false;trustServerCertificate=true → tắt SSL cho môi trường dev local
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ROMS;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================================
# JPA / HIBERNATE (ORM)
# ==========================================================
# ddl-auto=update → Hibernate tự tạo/sửa bảng dựa vào @Entity của mình
# CẢNH BÁO: Chỉ dùng "update" khi dev. Production phải dùng "validate"
spring.jpa.hibernate.ddl-auto=update

# Hiện câu SQL ra console để debug dễ hơn
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tắt Open-in-View để tránh giữ DB connection quá lâu (Best Practice)
spring.jpa.open-in-view=false

# ==========================================================
# JWT (JSON Web Token) - Xác thực người dùng
# ==========================================================
# Secret key dùng để ký token — phải bí mật, đủ dài (≥ 32 ký tự)
# Production: đọc từ environment variable, không hardcode như này
app.jwt.secret=mySecretKeyROMSProjectSWP391FPTUniversity2026

# Thời gian hết hạn của token staff = 8 giờ (1 ca làm việc)
# 8 * 60 * 60 * 1000 = 28,800,000 milliseconds
app.jwt.expiration-ms=28800000

# ==========================================================
# SERVER
# ==========================================================
server.port=8080

# ==========================================================
# LOGGING - mức độ chi tiết log
# ==========================================================
# DEBUG: hiện toàn bộ log của code mình viết (package com.romsteam)
logging.level.com.romsteam=DEBUG
# INFO: chỉ hiện thông tin quan trọng của Spring Security
logging.level.org.springframework.security=INFO
