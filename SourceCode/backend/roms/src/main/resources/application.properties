# ===================================================================
# 1. CAU HINH MAY CHU WEB (SERVER)
# ===================================================================
# Cong chay cua backend Spring Boot
server.port=8080

# ===================================================================
# 2. CAU HINH KET NOI CO SO DU LIEU MICROSOFT SQL SERVER
# ===================================================================
# Chuoi ket noi toi SQL Server (uu tien bien moi truong, mac dinh tro ve localhost / SSH Tunnel)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=ROMS_DB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;}
# Tai khoan dang nhap SQL Server (sa)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
# Mat khau dang nhap SQL Server
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:RomsPass123@2026}
# Trinh dieu khien ket noi chinh thuc cua Microsoft
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================================================================
# 3. CAU HINH SPRING DATA JPA & HIBERNATE
# ===================================================================
# 'update': Hibernate tu dong tao hoac cap nhat bang trong SQL Server khop voi code Java Entity
spring.jpa.hibernate.ddl-auto=update
# Hien thi cau lenh SQL ra terminal console khi truy van du lieu
spring.jpa.show-sql=false
# Dinh dang cau lenh SQL cho de doc tren console
spring.jpa.properties.hibernate.format_sql=true
# Phuong ngu tuong thich SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Bat buoc Hibernate su dung kieu du lieu NVARCHAR de luu tru tieng Viet khong bao gio bi loi ??
spring.jpa.properties.hibernate.use_nationalized_character_data=true
# Tat Open-Session-In-View de giai phong ket noi DB ngay sau tang Service, tang toc do xu ly
spring.jpa.open-in-view=false

# ===================================================================
# 4. CAU HINH BAO MAT JSON WEB TOKEN (JWT)
# ===================================================================
# Khoa bi mat dung de ky va xac thuc token JWT (chuoi toi thieu 256-bit chuan HMAC SHA-256)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Thoi han song cua token: 86400000 mili-giay = 24 gio
jwt.expiration=86400000

# ===================================================================
# 5. CAU HINH TAI LIEU SWAGGER OPENAPI
# ===================================================================
# Duong dan mo giao dien Swagger UI tren trinh duyet: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# ===================================================================
# CẤU HÌNH ĐỊA CHỈ TRUY CẬP FRONTEND (DÙNG ĐỂ SINH LINK TRONG MÃ QR)
# ===================================================================
# Khi triển khai trên VPS / Internet: dùng domain DuckDNS hoặc IP máy chủ
app.frontend.url=http://roms-restaurant.duckdns.org

# ===================================================================
# 6. CẤU HÌNH LOGGING MDC & TRACE ID (OBSERVABILITY)
# ===================================================================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] %-5level %logger{36} - %msg%n

# ===================================================================
# 7. CẤU HÌNH SPRING BOOT ACTUATOR (GIÁM SÁT HỆ THỐNG & SỨC KHỎE VẬN HÀNH)
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ===================================================================
# 8. CẤU HÌNH MÚI GIỜ HỆ THỐNG & SERIALIZER (VIỆT NAM GMT+7)
# ===================================================================
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===================================================================
# 9. CẤU HÌNH TRỢ LÝ AI CHATBOX CHO KHÁCH HÀNG (GOOGLE GEMINI API)
# ===================================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-flash-latest}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent

